function money(v) { return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function addonsById(ids) { return ids.map((id) => ADDONS.find((a) => a.id === id)).filter(Boolean); }
function unitPrice(item, addonIds) { return item.price + addonsById(addonIds).reduce((s, a) => s + a.price, 0); }
function lineKey(itemId, addonIds, notes) { return itemId + "|" + [...addonIds].sort().join(",") + "|" + notes.trim().toLowerCase(); }

async function seedProductsIfEmpty() {
  const snap = await db.collection("products").limit(1).get();
  if (snap.empty) {
    const batch = db.batch();
    DEFAULT_MENU.forEach((item) => batch.set(db.collection("products").doc(item.id), item));
    await batch.commit();
  }
}
function mesaInicial(id) { return { id, status: "livre", clienteNome: "", garcom: null, cart: [], enviados: [] }; }
async function seedTablesIfEmpty() {
  const snap = await db.collection("tables").limit(1).get();
  if (snap.empty) {
    const batch = db.batch();
    for (let i = 1; i <= TOTAL_MESAS; i++) batch.set(db.collection("tables").doc(String(i)), mesaInicial(i));
    await batch.commit();
  }
}

function App() {
  const [waiter, setWaiter] = useState(null);
  const [produtos, setProdutos] = useState(DEFAULT_MENU);
  const [mesas, setMesas] = useState([]);
  const [activeTableId, setActiveTableId] = useState(null);
  const [toast, setToast] = useState("");

  useEffect(() => { seedProductsIfEmpty(); seedTablesIfEmpty(); }, []);

  useEffect(() => {
    const unsub = db.collection("products").onSnapshot((snap) => { if (!snap.empty) setProdutos(snap.docs.map((d) => d.data())); });
    return () => unsub();
  }, []);

  // Mesas em tempo real — o que o admin mexer aparece aqui na hora, e vice-versa
  useEffect(() => {
    const unsub = db.collection("tables").orderBy(firebase.firestore.FieldPath.documentId()).onSnapshot((snap) => {
      setMesas(snap.docs.map((d) => ({ id: parseInt(d.id, 10), ...d.data() })));
    });
    return () => unsub();
  }, []);

  const allItems = React.useMemo(() => produtos.reduce((acc, i) => ({ ...acc, [i.id]: i }), {}), [produtos]);
  const menuByCategory = React.useMemo(() => {
    const cats = {};
    produtos.forEach((p) => { if (!cats[p.category]) cats[p.category] = []; cats[p.category].push(p); });
    return cats;
  }, [produtos]);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(""), 2200); }

  async function openTable(id) {
    const mesa = mesas.find((m) => m.id === id);
    if (mesa && mesa.status === "livre") {
      await db.collection("tables").doc(String(id)).set({ status: "ocupada", garcom: waiter.nome }, { merge: true });
    }
    setActiveTableId(id);
  }

  async function updateTable(id, patch) { await db.collection("tables").doc(String(id)).set(patch, { merge: true }); }

  async function addLineToTable(id, itemId, addonIds, notes, qty = 1) {
    const mesa = mesas.find((m) => m.id === id);
    const key = lineKey(itemId, addonIds, notes);
    const existing = mesa.cart.find((l) => l.key === key);
    const cart = existing ? mesa.cart.map((l) => (l.key === key ? { ...l, qty: l.qty + qty } : l)) : [...mesa.cart, { key, itemId, addonIds, notes, qty }];
    await updateTable(id, { cart, garcom: waiter.nome });
  }
  async function incCartLine(id, key) {
    const mesa = mesas.find((m) => m.id === id);
    await updateTable(id, { cart: mesa.cart.map((l) => (l.key === key ? { ...l, qty: l.qty + 1 } : l)) });
  }
  async function decCartLine(id, key) {
    const mesa = mesas.find((m) => m.id === id);
    await updateTable(id, { cart: mesa.cart.map((l) => (l.key === key ? { ...l, qty: l.qty - 1 } : l)).filter((l) => l.qty > 0) });
  }
  async function setClienteNome(id, nome) { await updateTable(id, { clienteNome: nome }); }
  async function enviarParaCozinha(id) {
    const mesa = mesas.find((m) => m.id === id);
    await updateTable(id, { enviados: [...mesa.enviados, ...mesa.cart], cart: [], garcom: waiter.nome });
    showToast("Pedido enviado para a cozinha e para o painel ADM!");
  }
  async function fecharMesa(id, paymentIds, troco, total) {
    await db.collection("transactions").add({
      origem: "Mesa " + id, forma: paymentIds[0] || "pix", valor: total,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await db.collection("tables").doc(String(id)).set(mesaInicial(id));
    setActiveTableId(null);
    showToast("Mesa fechada. Conta enviada para o caixa!");
  }

  if (!waiter) return <LoginScreen onLogin={setWaiter} />;
  const activeTable = mesas.find((t) => t.id === activeTableId);

  return (
    <div style={styles.page}>
      <style>{"* { box-sizing: border-box; } button { font-family: 'Rubik', sans-serif; cursor: pointer; border: none; background: none; } button:disabled { cursor: not-allowed; }"}</style>
      <div style={styles.phone}>
        <div style={styles.screenArea}>
          {!activeTable ? (
            <TablesScreen mesas={mesas} waiter={waiter} onOpenTable={openTable} onLogout={() => setWaiter(null)} />
          ) : (
            <TableDetailScreen
              table={activeTable} allItems={allItems} menuByCategory={menuByCategory}
              onBack={() => setActiveTableId(null)}
              onAddLine={(itemId, addonIds, notes, qty) => addLineToTable(activeTable.id, itemId, addonIds, notes, qty)}
              onInc={(key) => incCartLine(activeTable.id, key)}
              onDec={(key) => decCartLine(activeTable.id, key)}
              onSetCliente={(nome) => setClienteNome(activeTable.id, nome)}
              onEnviar={() => enviarParaCozinha(activeTable.id)}
              onFechar={(paymentIds, troco, total) => fecharMesa(activeTable.id, paymentIds, troco, total)}
            />
          )}
        </div>
        {toast && <div style={styles.toast}>{toast}</div>}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  async function handleLogin() {
    setLoading(true);
    setError("");
    try {
      const doc = await db.collection("staff").doc(user.trim().toLowerCase()).get();
      if (doc.exists && doc.data().pass === pass && doc.data().ativo) {
        onLogin(doc.data());
      } else if (doc.exists && !doc.data().ativo) {
        setError("Seu acesso foi bloqueado. Fale com a gerência.");
      } else {
        setError("Usuário ou senha incorretos");
      }
    } catch (e) {
      setError("Não foi possível conectar. Confira sua internet e a configuração do Firebase.");
    }
    setLoading(false);
  }
  return (
    <div style={styles.page}>
      <style>{"* { box-sizing: border-box; } button { cursor: pointer; border: none; background: none; }"}</style>
      <div style={styles.phone}>
        <div style={{ ...styles.screenArea, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ width: "100%", padding: "0 24px", textAlign: "center" }}>
            <img src={LOGO_SRC} alt="Na Brasa Burguer" style={{ width: 130, height: "auto", margin: "0 auto" }} />
            <p style={{ color: "#9A9A9A", fontSize: 12, margin: "10px 0 26px" }}>App do garçom · Pedidos de mesa</p>
            <label style={styles.loginLabel}>Usuário</label>
            <div style={styles.loginInputWrap}><UserIcon size={15} color="#8C7B52" /><input value={user} onChange={(e) => setUser(e.target.value)} placeholder="ex: joao" style={styles.loginInput} /></div>
            <label style={styles.loginLabel}>Senha</label>
            <div style={styles.loginInputWrap}><Lock size={15} color="#8C7B52" /><input value={pass} onChange={(e) => setPass(e.target.value)} type="password" placeholder="••••••••" style={styles.loginInput} /></div>
            {error && <p style={{ color: "#FF3B30", fontSize: 11.5, margin: "0 0 10px" }}>{error}</p>}
            <button style={styles.ctaBtn} onClick={handleLogin} disabled={loading}>{loading ? "ENTRANDO..." : "ENTRAR"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

      <button style={{ ...styles.ctaBtn, marginTop: 8 }} onClick={() => setClosing(true)}><Printer size={16} color="#171310" /> FECHAR MESA / PAGAMENTO</button>

function groupLines(lines) {
  const map = {};
  lines.forEach((l) => { if (!map[l.key]) map[l.key] = { ...l }; else map[l.key].qty += l.qty; });
  return Object.values(map);
}

function LineRow({ line, allItems, readOnly, onInc, onDec }) {
  const item = allItems[line.itemId] || { name: "?", img: "❓" };
  const addons = addonsById(line.addonIds);
  const price = unitPrice(item, line.addonIds);
  return (
    <div style={styles.itemCard}>
      <div style={styles.itemEmoji}>{item.img}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <p style={styles.itemName}>{item.name}</p>

        <span style={styles.priceTag}>{money(price)}</span>

      {readOnly ? (<span style={styles.qtyNum}>x{line.qty}</span>) : (
        <div style={styles.qtyControl}>
          <button style={styles.qtyBtn} onClick={onDec}><Minus size={13} color="#FFFFFF" /></button>

          <button style={styles.qtyBtnFilled} onClick={onInc}><Plus size={13} color="#FFFFFF" /></button>

      )}

  );
}

function CloseTableModal({ total, onClose, onConfirm }) {
  const [paymentIds, setPaymentIds] = useState(["pix"]);
  const [troco, setTroco] = useState("");
  const [dividir, setDividir] = useState(false);
  const [partes, setPartes] = useState(["", ""]);
  const [step, setStep] = useState("form");
  function toggle(id) { setPaymentIds((p) => (p.includes(id) ? p.filter((x) => x !== id) : p.length >= 2 ? p : [...p, id])); }
  function updateParte(i, v) { setPartes((p) => p.map((x, idx) => (idx === i ? v : x))); }
  function addParte() { setPartes((p) => [...p, ""]); }
  function removeParte(i) { setPartes((p) => p.filter((_, idx) => idx !== i)); }
  const temDinheiro = paymentIds.includes("dinheiro");
  const somaPartes = partes.reduce((s, v) => s + (parseFloat(v.replace(",", ".")) || 0), 0);

  if (step === "confirm") {
    return (
      <div style={styles.modalBackdrop} onClick={onClose}>
        <div style={styles.modalSheet} onClick={(e) => e.stopPropagation()}>
          <p style={{ margin: 0, fontSize: 15, fontWeight: 800, color: "#FFFFFF", textAlign: "center" }}>Confirmar pagamento</p>
          <p style={{ fontSize: 13, color: "#B8B8B8", textAlign: "center", marginTop: 10 }}>O pagamento de <span style={{ color: "#FFCE00", fontWeight: 800 }}>{money(total)}</span> foi realizado pelo cliente?</p>
          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <button style={styles.confirmNoBtn} onClick={() => setStep("form")}>NÃO</button>
            <button style={styles.confirmYesBtn} onClick={() => onConfirm(paymentIds, troco, total)}>SIM</button>
          </div>
          <p style={{ fontSize: 10, color: "#6B6B6B", textAlign: "center", marginTop: 12 }}>Se ainda não recebeu, toque em "Não" — a mesa continua aberta até confirmar.</p>
        </div>
      </div>
    );
  }
  return (
    <div style={styles.modalBackdrop} onClick={onClose}>
      <div style={styles.modalSheet} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <p style={{ margin: 0, fontSize: 15, fontWeight: 800, color: "#FFFFFF" }}>Fechar mesa</p>
          <button onClick={onClose} style={styles.modalCloseBtn}><X size={15} color="#FFFFFF" /></button>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 14 }}>
          <p style={{ margin: 0, fontSize: 11, letterSpacing: 1, fontWeight: 800, color: "#FFCE00" }}>DIVIDIR A CONTA?</p>
          <button onClick={() => setDividir((d) => !d)} style={{ ...styles.toggleBtn, ...(dividir ? styles.toggleBtnActive : {}) }}>{dividir ? "SIM" : "NÃO"}</button>
        </div>
        {dividir && (
          <div style={{ marginTop: 8 }}>
            {partes.map((v, i) => (
              <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                <input value={v} onChange={(e) => updateParte(i, e.target.value)} placeholder={"Parte " + (i + 1) + " (R$)"} style={styles.notesInput} />
                {partes.length > 1 && <button onClick={() => removeParte(i)} style={styles.qtyBtn}><X size={12} color="#FFFFFF" /></button>}
              </div>
            ))}
            <button onClick={addParte} style={styles.addParteBtn}>+ Adicionar parte</button>
            <p style={{ fontSize: 10.5, color: somaPartes.toFixed(2) === total.toFixed(2) ? "#2ECC71" : "#FF6B5F", marginTop: 4 }}>
              Soma das partes: {money(somaPartes)} {somaPartes.toFixed(2) !== total.toFixed(2) ? "(confira, o total da mesa é " + money(total) + ")" : "✓"}
            </p>
          </div>
        )}
        <p style={{ marginTop: 16, marginBottom: 8, fontSize: 11, letterSpacing: 1, fontWeight: 800, color: "#FFCE00" }}>FORMA DE PAGAMENTO</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {PAYMENT_METHODS.map((p) => {
            const active = paymentIds.includes(p.id);
            return (
              <button key={p.id} onClick={() => toggle(p.id)} style={{ ...styles.optionRow, ...(active ? styles.optionRowActive : {}) }}>
                <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#FFFFFF", fontWeight: 600 }}><p.icon size={16} color={active ? "#FF3B30" : "#9A9A9A"} /> {p.label}</span>
                {active && <Check size={16} color="#FF3B30" />}
              </button>
            );
          })}
        </div>
        {temDinheiro && <input value={troco} onChange={(e) => setTroco(e.target.value)} placeholder="Troco para quanto?" style={{ ...styles.notesInput, marginTop: 8 }} />}
        <div style={styles.summaryBox}><div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ fontWeight: 800, color: "#FFFFFF" }}>Total da mesa</span><span style={{ fontWeight: 800, color: "#FFCE00", fontSize: 16 }}>{money(total)}</span></div></div>
        <button style={{ ...styles.ctaBtn, marginTop: 14 }} onClick={() => setStep("confirm")}><Printer size={16} color="#171310" /> CONFIRMAR E IMPRIMIR CONTA</button>
      </div>
    </div>
  );
}
